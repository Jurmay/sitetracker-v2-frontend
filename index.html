<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Set the theme attribute before React mounts, so the page never
      // flashes the :root (light) defaults first and then jumps to the
      // saved theme - this runs synchronously, blocking render, which is
      // exactly what we want for a single tiny attribute read like this.
      (function () {
        var saved = localStorage.getItem('sitetracker-theme');
        document.documentElement.setAttribute('data-theme', saved || 'blue');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
